<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VR Şar Ovu</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block;touch-action:none}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#0b1030;padding:16px}
  button{font-size:20px;padding:14px 28px;margin:8px;border:0;border-radius:12px;background:#ffcc33;color:#111}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu">
  <h1>VR Şar Ovu</h1>
  <p>Telefonu yan çevirin və kameraya icazə verin.<br>Əlinizi arxa kameraya göstərin, şarı şəhadət barmağınızla partladın.</p>
  <button id="vr">VR eynəklə oyna</button>
  <button id="flat">Eynəksiz yoxla</button>
  <p id="msg"></p>
</div>
<script>
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const DWELL = 0.8, ROUND = 60;
const COLORS = ['#ff4d6d', '#4dd2ff', '#7dff6b', '#c77dff', '#ff9f1c'];
let W = 0, H = 0, stereo = true;
let state = 'ready', score = 0, best = 0, timeLeft = ROUND, dwell = 0, aimed = null;
let balloons = [], sparks = [], last = 0;
let sensor = null, yaw0 = null, dragYaw = 0, dragPitch = 0;
let tracker = null, hand = null, videoTime = -1, cooldown = 0;
let handStatus = 'Əl tanıma yüklənir...';
const video = document.createElement('video');
video.muted = true; video.playsInline = true;

const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } }
  });
  video.srcObject = stream;
  await video.play();
}

async function loadTracker() {
  const { FilesetResolver, HandLandmarker } = await import(MP + '/vision_bundle.mjs');
  const files = await FilesetResolver.forVisionTasks(MP + '/wasm');
  const make = delegate => HandLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: MODEL, delegate }, runningMode: 'VIDEO', numHands: 1
  });
  try { tracker = await make('GPU'); } catch (e) { tracker = await make('CPU'); }
}

function detectHand() {
  if (!tracker || video.readyState < 2 || video.currentTime === videoTime) return;
  videoTime = video.currentTime;
  const found = tracker.detectForVideo(video, performance.now()).landmarks;
  hand = found.length ? found[0] : null;
}

// Kamera görüntüsünü göz sahəsinə yerləşdirmə ölçüləri
function videoRect(w) {
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const s = Math.max(w / vw, H / vh);
  return { x: (w - vw * s) / 2, y: (H - vh * s) / 2, w: vw * s, h: vh * s };
}

// Şəhadət barmağının ucu (8-ci nöqtə) hansı şara dəyir?
function touched(m, targets) {
  const w = stereo ? W / 2 : W, f = Math.min(w, H) * 0.75, v = videoRect(w);
  const tx = v.x + hand[8].x * v.w, ty = v.y + hand[8].y * v.h;
  return targets.find(b => {
    const c = toCam(m, b.p);
    if (c[2] > -0.5) return false;
    const sx = w / 2 + f * c[0] / -c[2], sy = H / 2 - f * c[1] / -c[2];
    return Math.hypot(tx - sx, ty - sy) < f * b.r / -c[2];
  });
}

// --- 3x3 matris köməkçiləri ---
const mul = (a, b) => a.map(r => [0, 1, 2].map(j => r[0]*b[0][j] + r[1]*b[1][j] + r[2]*b[2][j]));
const rx = t => [[1,0,0],[0,Math.cos(t),-Math.sin(t)],[0,Math.sin(t),Math.cos(t)]];
const ry = t => [[Math.cos(t),0,Math.sin(t)],[0,1,0],[-Math.sin(t),0,Math.cos(t)]];
const rz = t => [[Math.cos(t),-Math.sin(t),0],[Math.sin(t),Math.cos(t),0],[0,0,1]];
const rad = d => d * Math.PI / 180;

function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  return window.orientation || 0;
}

// Kameradan dünyaya dönmə matrisi
function cameraMatrix() {
  if (!sensor) return mul(ry(dragYaw), rx(dragPitch));
  let m = mul(ry(rad(sensor.alpha)), rx(rad(sensor.beta)));
  m = mul(m, rz(rad(-sensor.gamma)));
  m = mul(m, rx(-Math.PI / 2));
  m = mul(m, rz(rad(-screenAngle())));
  if (yaw0 === null) yaw0 = Math.atan2(m[0][2], m[2][2]);
  return mul(ry(-yaw0), m);
}

// Dünya nöqtəsini kamera koordinatına çevir
const toCam = (m, p) => [0, 1, 2].map(j => m[0][j]*p[0] + m[1][j]*p[1] + m[2][j]*p[2]);

function newBalloon() {
  const yaw = (Math.random() - 0.5) * rad(200);
  const dist = 4 + Math.random() * 4;
  return {
    p: [-Math.sin(yaw) * dist, -1 + Math.random() * 3, -Math.cos(yaw) * dist],
    r: 0.35 + Math.random() * 0.2,
    v: 0.1 + Math.random() * 0.35,
    color: COLORS[Math.floor(Math.random() * COLORS.length)]
  };
}

function startRound() {
  state = 'playing'; score = 0; timeLeft = ROUND; dwell = 0; aimed = null;
  balloons = Array.from({ length: 6 }, newBalloon);
}

const startButton = { p: [0, 0, -4], r: 0.7, color: '#ffcc33' };

function update(dt, m) {
  if (state === 'playing') {
    timeLeft -= dt;
    for (let i = 0; i < balloons.length; i++) {
      balloons[i].p[1] += balloons[i].v * dt;
      if (balloons[i].p[1] > 4) balloons[i] = newBalloon();
    }
    if (timeLeft <= 0) { state = 'over'; timeLeft = 0; best = Math.max(best, score); cooldown = 1.5; dwell = -1; aimed = null; }
  }
  sparks.forEach(s => { s.t += dt; });
  sparks = sparks.filter(s => s.t < 0.4);

  const targets = state === 'playing' ? balloons : [startButton];
  cooldown = Math.max(0, cooldown - dt);

  // Əl ilə idarə
  if (tracker) {
    aimed = null; dwell = 0;
    const b = hand && cooldown === 0 ? touched(m, targets) : null;
    if (b) pop(b);
    return;
  }

  // Əl tanıma işləmirsə: baxışla idarə
  let hit = null, nearest = Infinity;
  for (const b of targets) {
    const c = toCam(m, b.p);
    const d = Math.hypot(...c);
    if (c[2] < 0 && Math.hypot(c[0], c[1]) < b.r && d < nearest) { hit = b; nearest = d; }
  }
  if (hit !== aimed) { aimed = hit; dwell = Math.min(dwell, 0); }
  if (!hit) { dwell = 0; return; }
  dwell += dt;
  if (dwell >= DWELL) pop(hit);
}

function pop(hit) {
  if (state === 'playing') {
    score++;
    sparks.push({ p: hit.p.slice(), color: hit.color, t: 0 });
    balloons[balloons.indexOf(hit)] = newBalloon();
    if (navigator.vibrate) navigator.vibrate(40);
  } else startRound();
  cooldown = 0.15; dwell = 0; aimed = null;
}

function drawEye(m, x, w, eyeX) {
  const f = Math.min(w, H) * 0.75, cx = x + w / 2, cy = H / 2;
  const cam = p => { const c = toCam(m, p); c[0] -= eyeX; return c; };
  const proj = c => [cx + f * c[0] / -c[2], cy - f * c[1] / -c[2]];
  g.save();
  g.beginPath(); g.rect(x, 0, w, H); g.clip();
  g.fillStyle = '#0b1030'; g.fillRect(x, 0, w, H);
  const v = videoRect(w), live = video.readyState >= 2;
  if (live) g.drawImage(video, x + v.x, v.y, v.w, v.h);

  // Döşəmə toru
  g.strokeStyle = '#3550a0'; g.lineWidth = 1;
  const line = (p, q) => {
    let a = cam(p), b = cam(q);
    const near = -0.1;
    if (a[2] > near && b[2] > near) return;
    const cut = (o, i) => { const t = (near - i[2]) / (o[2] - i[2]); return i.map((v, k) => v + (o[k] - v) * t); };
    if (a[2] > near) a = cut(a, b);
    if (b[2] > near) b = cut(b, a);
    g.beginPath(); g.moveTo(...proj(a)); g.lineTo(...proj(b)); g.stroke();
  };
  if (!live) for (let i = -12; i <= 12; i += 2) { line([i, -2, -12], [i, -2, 12]); line([-12, -2, i], [12, -2, i]); }

  // Şarlar (uzaqdan yaxına)
  const list = (state === 'playing' ? balloons : [startButton])
    .map(b => ({ b, c: cam(b.p) })).filter(o => o.c[2] < -0.5)
    .sort((a, b) => Math.hypot(...b.c) - Math.hypot(...a.c));
  for (const { b, c } of list) {
    const [sx, sy] = proj(c), r = f * b.r / -c[2];
    const grad = g.createRadialGradient(sx - r*0.35, sy - r*0.35, r*0.1, sx, sy, r);
    grad.addColorStop(0, '#fff'); grad.addColorStop(0.35, b.color); grad.addColorStop(1, '#221133');
    g.fillStyle = grad; g.beginPath(); g.arc(sx, sy, r, 0, Math.PI * 2); g.fill();
    if (b === startButton) {
      g.fillStyle = '#111'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = 'bold ' + r * 0.34 + 'px system-ui';
      g.fillText(state === 'over' ? 'YENİDƏN' : 'BAŞLA', sx, sy);
    }
  }

  // Partlama effekti
  for (const s of sparks) {
    const c = cam(s.p);
    if (c[2] > -0.5) continue;
    const [sx, sy] = proj(c), r = f * (0.3 + s.t * 2) / -c[2];
    g.fillStyle = s.color;
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5;
      g.beginPath(); g.arc(sx + Math.cos(a)*r, sy + Math.sin(a)*r, 4, 0, Math.PI * 2); g.fill();
    }
  }

  // Yazılar
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold ' + Math.round(f * 0.07) + 'px system-ui';
  if (state === 'playing') g.fillText('Xal ' + score + '   Vaxt ' + Math.ceil(timeLeft), cx, H * 0.22);
  if (state === 'over') g.fillText('Bitdi! Xal ' + score + '   Rekord ' + best, cx, H * 0.22);
  if (state === 'ready') g.fillText(tracker ? 'BAŞLA şarına barmağınla toxun' : 'BAŞLA şarına bax', cx, H * 0.22);

  // Əl skeleti və ya nişangah
  if (handStatus) g.fillText(handStatus, cx, H * 0.82);
  if (tracker && hand) {
    g.fillStyle = '#7dff6b';
    hand.forEach((p, i) => {
      g.beginPath();
      g.arc(x + v.x + p.x * v.w, v.y + p.y * v.h, i === 8 ? 10 : 3, 0, Math.PI * 2); g.fill();
    });
  } else if (!tracker) {
    g.beginPath(); g.arc(cx, cy, 3, 0, Math.PI * 2); g.fill();
    if (aimed && dwell > 0) {
      g.strokeStyle = '#fff'; g.lineWidth = 4; g.beginPath();
      g.arc(cx, cy, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(dwell / DWELL, 1)); g.stroke();
    }
  }
  g.restore();
}

function frame(t) {
  const dt = Math.min((t - last) / 1000, 0.05); last = t;
  const m = cameraMatrix();
  try { detectHand(); } catch (e) { tracker = null; hand = null; handStatus = 'Əl tanıma dayandı, baxışla oynayın'; }
  update(dt, m);
  if (stereo) {
    drawEye(m, 0, W / 2, 0);
    drawEye(m, W / 2, W / 2, 0);
    g.fillStyle = '#fff'; g.fillRect(W / 2 - 1, 0, 2, H);
  } else drawEye(m, 0, W, 0);
  requestAnimationFrame(frame);
}

function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * d; canvas.height = H * d;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  g.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => { yaw0 = null; });

function onOrientation(e) {
  if (e.alpha !== null && e.beta !== null) sensor = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
}

async function begin(useVR) {
  stereo = useVR;
  try {
    const D = window.DeviceOrientationEvent;
    if (D && D.requestPermission) await D.requestPermission();   // iPhone icazəsi
  } catch (e) {}
  addEventListener('deviceorientation', onOrientation);
  if (useVR) {
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    try { await screen.orientation.lock('landscape'); } catch (e) {}
    try { await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  const msg = document.getElementById('msg');
  msg.textContent = 'Kamera açılır...';
  try { await startCamera(); }
  catch (e) {
    msg.textContent = 'Kamera açılmadı. Səhifəni https ünvanından açın və kameraya icazə verin.';
    return;
  }
  document.getElementById('menu').style.display = 'none';
  yaw0 = null; resize();
  if (!tracker) loadTracker()
    .then(() => { handStatus = ''; })
    .catch(() => { handStatus = 'Əl tanıma yüklənmədi, baxışla oynayın'; });
}
document.getElementById('vr').onclick = () => begin(true);
document.getElementById('flat').onclick = () => begin(false);

// Sensor yoxdursa barmaqla / siçanla ətrafa bax
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', e => {
  if (!drag) return;
  dragYaw += (e.clientX - drag[0]) * 0.004;
  dragPitch = Math.max(-1.3, Math.min(1.3, dragPitch + (e.clientY - drag[1]) * 0.004));
  drag = [e.clientX, e.clientY];
});

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>

</body></html>
